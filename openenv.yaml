version: "1.0"
name: "AutoSRE-PostMortem-v1"
description: "A Static Autopsy Sandbox. The AI agent acts as a Site Reliability Engineer (SRE). It must use Linux terminal commands to parse server logs, find bugs, and patch broken configurations under simulated time pressure."
action_space: "models.SREAction"
observation_space: "models.SREObservation"
tasks:
  - id: "task-1-config-bug"
    difficulty: "easy"
    description: "Identify a 502 Bad Gateway error in access.log and patch the port mapping in docker-compose.yml."
  - id: "task-2-memory-leak"
    difficulty: "medium"
    description: "Find an infinite loop in payment_service.py, patch the code, and ensure it passes the local test script."
  - id: "task-3-cascading-failure"
    difficulty: "hard"
    description: "Extract DDoS IP addresses from logs and simulate an iptables firewall block BEFORE patching the broken database.yml password."