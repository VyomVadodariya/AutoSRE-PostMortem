[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "autosre-postmortem"
version = "1.0.0"
dependencies = [
    "openenv-core",
    "pydantic",
    "requests",
    "fastapi",
    "uvicorn",
    "openai",
    "streamlit",
    "pandas"
]
[project.scripts]
server = "server.app:main"